<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Animated gradient: solid pink -> rotating through several colors -> red, on black -->
    <linearGradient id="pg" x1="0" y1="0" x2="0.6" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff8ac2">
        <animate attributeName="stop-color"
          values="#ff8ac2;#ff4fb3;#ff2ea6;#ff1f9e;#ff2db4;#ff4fb3;#ff8ac2;#ff71ce;#ff9ad9;#ffc2e6;#ff8ac2;#ff6a3a;#f43b3b;#d92a2a;#ff6a3a;#ff8ac2"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.3" stop-color="#ff2ea6">
        <animate attributeName="stop-color"
          values="#ff2ea6;#ff2db4;#ff1f9e;#ff8ac2;#ff2ea6;#ff2db4;#ff9ad9;#ff6a3a;#f43b3b;#d92a2a;#ff1f9e;#ff8ac2;#ff2ea6;#ff6a3a;#d92a2a;#ff2ea6"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#e6007c">
        <animate attributeName="stop-color"
          values="#e6007c;#ff2ea6;#e6007c;#ffb3a0;#ff6a3a;#e6007c;#ffc2e6;#ff8ac2;#e6007c;#ff9ad9;#ff2ea6;#ff6a3a;#f43b3b;#d92a2a;#e6007c;#e6007c"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.8" stop-color="#f43b3b">
        <animate attributeName="stop-color"
          values="#f43b3b;#d92a2a;#ff6a3a;#f43b3b;#ff2db4;#d92a2a;#f43b3b;#ff6a3a;#e6007c;#f43b3b;#ffb3a0;#f43b3b;#ff8ac2;#f43b3b;#d92a2a;#f43b3b"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#d92a2a">
        <animate attributeName="stop-color"
          values="#d92a2a;#f43b3b;#ff2db4;#e6007c;#d92a2a;#ff6a3a;#d92a2a;#f43b3b;#ff2ea6;#d92a2a;#ff8ac2;#d92a2a;#ff6a3a;#f43b3b;#d92a2a;#d92a2a"
          dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Capital P: ring bowl + vertical stem -->
  <g stroke="url(#pg)" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path stroke-width="60" d="M 166 133.5 A 97 97 0 1 1 166 230.5"/>
    <path stroke-width="66" d="M 170 112 L 170 427"/>
  </g>
</svg>