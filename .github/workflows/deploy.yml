name: Deploy PROXIMITY Dating App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Socket.IO server dependencies
      run: |
        cd socket-server
        npm ci
        cd ..
        
    - name: Run linting
      run: npm run lint
      
    - name: Build applications
      run: npm run build:all
      
    - name: Run tests
      run: |
        npm test
        npm run test:socket

  deploy-vercel:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install Vercel CLI
      run: npm install -g vercel
      
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Deploy to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        vercel --prod --token $VERCEL_TOKEN

  deploy-socket:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: socket-server/package-lock.json
        
    - name: Install Socket.IO server dependencies
      run: |
        cd socket-server
        npm ci
        
    - name: Build Socket.IO server
      run: |
        cd socket-server
        npm run build
        
    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        # Install Railway CLI
        npm install -g @railway/cli
        
        # Login to Railway
        railway login --token $RAILWAY_TOKEN
        
        # Deploy Socket.IO server
        cd socket-server
        railway up

  notify:
    needs: [deploy-vercel, deploy-socket]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Notify deployment
      run: |
        echo "🎉 PROXIMITY Dating App deployed successfully!"
        echo "📱 Next.js app deployed to Vercel"
        echo "🔌 Socket.IO server deployed to Railway"
        echo "🚀 Both services are now live!"