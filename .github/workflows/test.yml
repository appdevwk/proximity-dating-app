name: Test PROXIMITY Dating App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-main-app:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Build application
      run: npm run build
      
    - name: Run tests
      run: npm test
      continue-on-error: true
      
  test-socket-server:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: socket-server/package-lock.json
        
    - name: Install Socket.IO server dependencies
      run: |
        cd socket-server
        npm ci
        
    - name: Build Socket.IO server
      run: |
        cd socket-server
        npm run build
        
    - name: Run Socket.IO server tests
      run: |
        cd socket-server
        npm test
      continue-on-error: true

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-main-app, test-socket-server]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install all dependencies
      run: |
        npm ci
        cd socket-server
        npm ci
        cd ..
        
    - name: Build both applications
      run: |
        npm run build
        cd socket-server
        npm run build
        cd ..
        
    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        # Add integration test commands here
        
    - name: Test Socket.IO health endpoint
      run: |
        echo "Testing Socket.IO configuration..."
        # Test Socket.IO server configuration