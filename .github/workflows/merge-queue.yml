name: Merge Queue Protection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  validate-merge:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Socket.IO server dependencies
      run: |
        cd socket-server
        npm ci
        cd ..
        
    - name: Run linting
      run: npm run lint:all
      
    - name: Build applications
      run: npm run build:all
      
    - name: Run tests
      run: |
        npm test
        npm run test:socket
        
    - name: Check for security vulnerabilities
      run: |
        npm audit --audit-level=moderate
        cd socket-server
        npm audit --audit-level=moderate
        cd ..
        
    - name: Validate TypeScript
      run: |
        npx tsc --noEmit
        cd socket-server
        npx tsc --noEmit
        cd ..

  validate-changes:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Check for breaking changes
      run: |
        # Check if package.json versions have been updated
        if git diff --name-only origin/main...HEAD | grep -q "package.json"; then
          echo "⚠️  package.json has been modified"
          echo "📋 Please ensure version numbers have been updated if necessary"
        fi
        
        # Check if database schema has changed
        if git diff --name-only origin/main...HEAD | grep -q "prisma/schema.prisma"; then
          echo "⚠️  Database schema has been modified"
          echo "📋 Please ensure migrations have been created"
        fi
        
        # Check if environment variables have changed
        if git diff --name-only origin/main...HEAD | grep -q ".env.example"; then
          echo "⚠️  Environment variables have been modified"
          echo "📋 Please update production environment variables accordingly"
        fi

  comment-on-pr:
    needs: [validate-merge, validate-changes]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const { context } = require('@actions/github');
          
          let comment = '## 🚀 Merge Queue Validation Results\n\n';
          
          if (${{ needs.validate-merge.result }} === 'success') {
            comment += '✅ **All checks passed!**\n\n';
            comment += '- ✅ Linting completed successfully\n';
            comment += '- ✅ Build completed successfully\n';
            comment += '- ✅ Tests completed successfully\n';
            comment += '- ✅ Security audit passed\n';
            comment += '- ✅ TypeScript validation passed\n';
          } else {
            comment += '❌ **Some checks failed!**\n\n';
            comment += 'Please review the logs and fix any issues before merging.\n';
          }
          
          if (${{ needs.validate-changes.result }} === 'success') {
            comment += '- ✅ Change validation completed\n';
          } else {
            comment += '- ⚠️  Change validation requires attention\n';
          }
          
          comment += '\n---\n';
          comment += 'This PR is ready for review and merge once all checks pass.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });